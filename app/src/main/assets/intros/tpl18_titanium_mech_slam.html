<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NH BOX - Heavy Industrial Titanium Piston 3D Drop Slam (Ultra HD)</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root { --bg:#07080A; --panel:#0d111d; --border:#232d48; --ac:#F97316; --text:#F8FAFC; --muted:#94A3B8; box-sizing:border-box; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px 14px 36px; }
.wrap { width:100%; max-width:1120px; display:flex; flex-direction:column; gap:12px; }
.header { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; }
.title-group h1 { font-size:21px; font-weight:900; display:flex; align-items:center; gap:10px; }
.badge { background:#F97316; color:#000; font-size:11px; font-weight:900; padding:3px 9px; border-radius:4px; letter-spacing:1px; }
.desc { color:var(--muted); font-size:12.5px; margin-top:3px; }
.canvas-holder { width:100%; background:#000; border-radius:12px; overflow:hidden; border:1px solid var(--border); box-shadow:0 20px 60px rgba(0,0,0,0.92); }
canvas#cv { width:100%; height:auto; aspect-ratio:16/9; display:block; background:#000; }
.controls-bar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; background:var(--panel); border:1px solid var(--border); padding:10px 14px; border-radius:10px; }
.btn-cluster, .toggles { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
button, select { font:600 12.5px inherit; padding:8px 13px; border-radius:7px; border:1px solid #2d3858; background:#141a2e; color:#fff; cursor:pointer; }
button.primary { background:#F97316; color:#000; font-weight:800; border-color:#fff; }
.toggles label { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:5px; cursor:pointer; }
.status-bar { display:flex; justify-content:space-between; font:12px ui-monospace,monospace; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="title-group">
      <h1>NH BOX <span class="badge">HEAVY INDUSTRIAL TITANIUM PISTON 3D DROP SLAM</span></h1>
      <p class="desc">1920x1080 60FPS Ultra HD • Per-Character Animated Text Engine • Custom Brand &amp; Tagline Support • Procedural WebAudio SFX.</p>
    </div>
  </div>
  <div class="canvas-holder"><canvas id="cv" width="1920" height="1080"></canvas></div>
  <div class="controls-bar">
    <div class="btn-cluster">
      <button id="pv" class="primary">▶ Preview Chalao</button>
      <button id="btnReplay">⟲ Replay Text Animation</button>
      <select id="scSel"></select>
      <button id="btnFs">⛶ Fullscreen</button>
    </div>
    <div class="toggles">
      <label><input type="checkbox" id="cap" checked> Subtitles</label>
      <label><input type="checkbox" id="sf" checked> Studio SFX</label>
      <button id="dl">⬇ SFX Track (WAV)</button>
    </div>
  </div>
  <div class="status-bar">
    <span id="st">Status: Ready. Click Preview.</span>
    <span id="timing">0.00s / 8.00s [60 FPS]</span>
  </div>
</div>

<script>
/* ==========================================================================
   1. DYNAMIC BRAND TEXT, TAGLINE & HTML2VIDEO BRIDGE CONTRACT
   ========================================================================== */
var BRAND_TEXT = "NH BOX";
var TAGLINE_TEXT = "A N   N H B O X   O R I G I N A L";
var MODE = "PISTON_SLAM_3D";
var BG1 = "#07080A", BG2 = "#1A1E24";
var C1 = "#F97316", C2 = "#94A3B8", C3 = "#FFFFFF";
var BASE_FREQ = 73.42;
var SFX_STYLE = "HEAVY";

var SC = [
  { "min": 4.0, "vo": "NH BOX Originals presents..." },
  { "min": 4.0, "vo": "Experience next level entertainment on NH BOX." }
];
var S = SC;

var cv = document.getElementById("cv"), c = cv.getContext("2d");
var W = 1920, H = 1080, CX = 960, CY = 540;
var cl = function(v, a, b) { return v < a ? a : v > b ? b : v; };
var seg = function(t, a, b) { return cl((t - a) / (b - a), 0, 1); };
var easeOutCubic = function(t) { t = cl(t, 0, 1); return 1 - Math.pow(1 - t, 3); };
var easeInOutCubic = function(t) { t = cl(t, 0, 1); return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; };
var easeOutBack = function(t) {
  t = cl(t, 0, 1);
  var c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
};

var DUR = null, PLAN = [], TOTAL = 8.0;
function buildPlan() {
  PLAN = [
    { i: 0, start: 0.0, len: 4.0, vd: 3.2, vs: 0.3 },
    { i: 1, start: 4.0, len: 4.0, vd: 3.2, vs: 0.3 }
  ];
  TOTAL = 8.0;
}
buildPlan();

var NH = {
  lang: "hi-IN",
  narration: function() { return JSON.stringify(SC.map(function(s) { return { a: s.vo, b: "" }; })); },
  setDurations: function(j) {
    try { DUR = typeof j === "string" ? JSON.parse(j) : j; } catch(e) {}
    buildPlan();
    return { total: TOTAL, events: PLAN.map(function(p, i) { return { time: p.start, scene: i, text: SC[i].vo }; }) };
  },
  run: function(fps) {
    fps = fps || 60;
    var N = Math.ceil(TOTAL * fps), n = 0;
    function step() {
      if (n >= N) { if (window.Android && window.Android.done) window.Android.done(); return; }
      frameAt(n / fps);
      if (window.Android && window.Android.pushFrame) {
        try { window.Android.pushFrame(cv.toDataURL("image/jpeg", 0.92)); } catch(e) {}
      }
      if (window.Android && window.Android.progress) window.Android.progress(n, N);
      n++;
      requestAnimationFrame(step);
    }
    step();
  }
};
window.NH = NH;
window.bedSched = function() {};

/* ==========================================================================
   2. PROCEDURAL WEBAUDIO STUDIO SFX ENGINE (PER-LETTER DRAW + IMPACT + CHORD)
   ========================================================================== */
var actx = null;
function getAudioContext() {
  if (!actx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
  if (actx && actx.state === "suspended") actx.resume();
  return actx;
}

function scheduleTemplateAudio(ctx, baseTime) {
  var master = ctx.createGain();
  master.gain.setValueAtTime(0.90, baseTime);
  master.connect(ctx.destination);

  var comp = ctx.createDynamicsCompressor();
  comp.threshold.setValueAtTime(-14, baseTime);
  comp.ratio.setValueAtTime(5, baseTime);
  comp.connect(master);

  var nBuf = ctx.createBuffer(1, ctx.sampleRate * 4.0, ctx.sampleRate);
  var nd = nBuf.getChannelData(0);
  for (var i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

  // 1. Opening Energy Riser (0.1s -> 1.3s)
  var ris = ctx.createBufferSource(); ris.buffer = nBuf;
  var rF = ctx.createBiquadFilter(); rF.type = "bandpass"; rF.Q.setValueAtTime(4.5, baseTime + 0.1);
  rF.frequency.setValueAtTime(180, baseTime + 0.1);
  rF.frequency.exponentialRampToValueAtTime(2200, baseTime + 1.3);
  var rG = ctx.createGain();
  rG.gain.setValueAtTime(0.0001, baseTime + 0.1);
  rG.gain.linearRampToValueAtTime(0.24, baseTime + 1.15);
  rG.gain.exponentialRampToValueAtTime(0.0001, baseTime + 1.45);
  ris.connect(rF); rF.connect(rG); rG.connect(comp);
  ris.start(baseTime + 0.1, 0, 1.4);

  // 2. Per-Character Animated Write / Reveal Cues (1.20s -> 4.20s)
  var ratios = [1.0, 1.25, 1.5, 1.875, 2.0, 2.5];
  for (var k = 0; k < 6; k++) {
    var tC = baseTime + 1.25 + k * 0.45;
    // Character whoosh/laser snap
    var sw = ctx.createBufferSource(); sw.buffer = nBuf;
    var sf = ctx.createBiquadFilter(); sf.type = "bandpass"; sf.Q.setValueAtTime(5.5, tC);
    sf.frequency.setValueAtTime(800 + k * 320, tC);
    sf.frequency.exponentialRampToValueAtTime(3200, tC + 0.32);
    var sg = ctx.createGain();
    sg.gain.setValueAtTime(0.0001, tC);
    sg.gain.linearRampToValueAtTime(0.18, tC + 0.08);
    sg.gain.exponentialRampToValueAtTime(0.0001, tC + 0.35);
    sw.connect(sf); sf.connect(sg); sg.connect(comp);
    sw.start(tC, (k * 0.25) % 2.5, 0.36);

    // Harmonic note per character
    var o = ctx.createOscillator(), og = ctx.createGain();
    o.type = (SFX_STYLE === "CYBER" || SFX_STYLE === "HEAVY") ? "sawtooth" : "triangle";
    o.frequency.setValueAtTime(BASE_FREQ * 2 * ratios[k % ratios.length], tC + 0.12);
    og.gain.setValueAtTime(0.0001, tC + 0.12);
    og.gain.linearRampToValueAtTime(0.11, tC + 0.15);
    og.gain.exponentialRampToValueAtTime(0.0001, tC + 0.95);
    o.connect(og); og.connect(comp);
    o.start(tC + 0.12); o.stop(tC + 1.0);
  }

  // 3. Final Master Lockup Sub-Drop & Lush Pad Chord (4.15s -> 7.80s)
  var tLock = baseTime + 4.15;
  var sub = ctx.createOscillator(), subG = ctx.createGain();
  sub.type = "sine";
  sub.frequency.setValueAtTime(BASE_FREQ, tLock);
  sub.frequency.exponentialRampToValueAtTime(40, tLock + 0.30);
  subG.gain.setValueAtTime(0.88, tLock);
  subG.gain.exponentialRampToValueAtTime(0.0001, tLock + 3.4);
  sub.connect(subG); subG.connect(comp);
  sub.start(tLock); sub.stop(tLock + 3.5);

  [1.0, 1.5, 2.0, 2.5, 3.0].forEach(function(mult, idx) {
    var p = ctx.createOscillator(), flt = ctx.createBiquadFilter(), pg = ctx.createGain();
    p.type = idx < 2 ? "sawtooth" : "triangle";
    p.frequency.setValueAtTime(BASE_FREQ * mult, tLock);
    flt.type = "lowpass"; flt.frequency.setValueAtTime(2200, tLock);
    flt.frequency.exponentialRampToValueAtTime(480, tLock + 3.4);
    var v = 0.10 / (1 + idx * 0.22);
    pg.gain.setValueAtTime(0.0001, tLock);
    pg.gain.linearRampToValueAtTime(v, tLock + 0.12);
    pg.gain.exponentialRampToValueAtTime(0.0001, tLock + 3.5);
    p.connect(flt); flt.connect(pg); pg.connect(comp);
    p.start(tLock); p.stop(tLock + 3.6);
  });
}

function renderSfxWav(cb) {
  var off = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(2, Math.ceil(44100 * TOTAL), 44100);
  scheduleTemplateAudio(off, 0);
  off.startRendering().then(function(buf) {
    var numOfChan = buf.numberOfChannels, len = buf.length * numOfChan * 2 + 44;
    var out = new DataView(new ArrayBuffer(len)), ch = [], pos = 0, offset = 0;
    function u16(d) { out.setUint16(pos, d, true); pos += 2; }
    function u32(d) { out.setUint32(pos, d, true); pos += 4; }
    u32(0x46464952); u32(len - 8); u32(0x45564157); u32(0x20746d66); u32(16); u16(1); u16(numOfChan);
    u32(buf.sampleRate); u32(buf.sampleRate * 2 * numOfChan); u16(numOfChan * 2); u16(16); u32(0x61746164); u32(len - pos - 4);
    for (var i = 0; i < numOfChan; i++) ch.push(buf.getChannelData(i));
    while (offset < buf.length) {
      for (var cIdx = 0; cIdx < numOfChan; cIdx++) {
        var s = Math.max(-1, Math.min(1, ch[cIdx][offset]));
        out.setInt16(pos, (s < 0 ? s * 32768 : s * 32767) | 0, true); pos += 2;
      }
      offset++;
    }
    cb(new Blob([out], { type: "audio/wav" }));
  });
}

/* ==========================================================================
   3. PROCEDURAL PARTICLES & GEOMETRY HELPERS
   ========================================================================== */
function sr(seed) { var x = Math.sin(seed * 12.9898) * 43758.5453; return x - Math.floor(x); }
var PTS = [];
for (var i = 0; i < 160; i++) {
  PTS.push({
    x: (sr(i * 3 + 1) - 0.5) * W * 1.4,
    y: (sr(i * 7 + 2) - 0.5) * H * 1.4,
    z: 80 + sr(i * 11 + 3) * 1400,
    sz: 1.5 + sr(i * 17) * 4.5,
    ang: sr(i * 23) * Math.PI * 2,
    col: i % 3 === 0 ? C1 : (i % 3 === 1 ? C2 : C3)
  });
}

/* ==========================================================================
   4. MASTER MULTI-MODE PER-CHARACTER ANIMATION ENGINE: frameAt(T)
   ========================================================================== */
function drawBackdropAndEnvironment(T) {
  var bg = c.createRadialGradient(CX, CY, 40, CX, CY, 1100);
  bg.addColorStop(0.0, BG2);
  bg.addColorStop(1.0, BG1);
  c.fillStyle = bg;
  c.fillRect(0, 0, W, H);

  // Mode-specific dynamic background architecture
  c.save();
  c.globalCompositeOperation = "screen";

  if (MODE === "SYNTHWAVE_CHROME") {
    // Retro 80s glowing neon sun + 3D perspective horizon grid
    var sunG = c.createLinearGradient(CX, CY - 260, CX, CY + 60);
    sunG.addColorStop(0, "#FFBE0B"); sunG.addColorStop(0.5, "#FF007F"); sunG.addColorStop(1, "#7209B7");
    c.fillStyle = sunG;
    c.beginPath(); c.arc(CX, CY - 90, 175, 0, Math.PI * 2); c.fill();
    // Horizontal scanline cutouts on retro sun
    c.globalCompositeOperation = "source-over";
    c.fillStyle = BG1;
    for (var sy = CY - 60; sy < CY + 90; sy += 18) {
      c.fillRect(CX - 200, sy, 400, 6);
    }
    c.globalCompositeOperation = "screen";
    // Perspective floor grid
    c.strokeStyle = C2; c.lineWidth = 2; c.globalAlpha = 0.45;
    var hz = CY + 85;
    for (var gx = -1800; gx <= 1800; gx += 120) {
      c.beginPath(); c.moveTo(CX + gx * 0.12, hz); c.lineTo(CX + gx, H); c.stroke();
    }
    var scrollY = (T * 80) % 40;
    for (var gy = hz + 12; gy < H; gy += 36) {
      var py = gy + scrollY * ((gy - hz) / 400);
      c.beginPath(); c.moveTo(0, py); c.lineTo(W, py); c.stroke();
    }
  } else if (MODE === "MATRIX_DECODE") {
    // Falling digital green cyber rain columns
    c.font = "700 20px monospace";
    c.fillStyle = C1;
    for (var col = 0; col < 48; col++) {
      var rx = col * 42;
      var ry = ((T * (180 + (col % 5) * 60) + col * 130) % (H + 200)) - 100;
      for (var chIdx = 0; chIdx < 8; chIdx++) {
        c.globalAlpha = (1 - chIdx / 8) * 0.35;
        var sym = String.fromCharCode(0x30A0 + ((col * 7 + chIdx + Math.floor(T * 12)) % 64));
        c.fillText(sym, rx, ry - chIdx * 22);
      }
    }
  } else if (MODE === "EQUALIZER_RISE") {
    // 64-band glowing audio spectrum equalizer bars across bottom/center
    var bars = 64, bw = 20, gap = 6;
    var startBX = CX - (bars * (bw + gap)) / 2;
    for (var b = 0; b < bars; b++) {
      var amp = (0.2 + 0.8 * Math.abs(Math.sin(T * 5.5 + b * 0.32) * Math.cos(T * 3.2 - b * 0.18))) * seg(T, 0.1, 1.5);
      var bh = amp * 340;
      c.fillStyle = b % 2 === 0 ? C1 : C2;
      c.globalAlpha = 0.28;
      c.fillRect(startBX + b * (bw + gap), CY + 180 - bh, bw, bh);
    }
  } else if (MODE === "SEARCHLIGHT_MONOLITH") {
    // Sweeping Hollywood premiere searchlight beams
    for (var sl = 0; sl < 4; sl++) {
      var baseSX = 280 + sl * 450;
      var tilt = Math.sin(T * (1.1 + sl * 0.3) + sl) * 0.48;
      c.save();
      c.translate(baseSX, H);
      c.rotate(tilt);
      var bG = c.createLinearGradient(0, 0, 0, -1200);
      bG.addColorStop(0, "rgba(255, 215, 100, 0.35)");
      bG.addColorStop(1, "rgba(255, 215, 100, 0)");
      c.fillStyle = bG;
      c.beginPath(); c.moveTo(-20, 0); c.lineTo(-220, -1200); c.lineTo(220, -1200); c.lineTo(20, 0); c.closePath(); c.fill();
      c.restore();
    }
  }

  // Ambient 3D floating particles
  for (var p = 0; p < PTS.length; p++) {
    var pt = PTS[p];
    var z = ((pt.z - T * 220) % 1400 + 1400) % 1400;
    if (z < 20) continue;
    var sc = 600 / z;
    var px = CX + pt.x * sc;
    var py = CY + pt.y * sc;
    if (px < 0 || px > W || py < 0 || py > H) continue;
    c.globalAlpha = cl((1 - z / 1400) * 0.65, 0, 1);
    c.fillStyle = pt.col;
    c.beginPath(); c.arc(px, py, pt.sz * sc, 0, Math.PI * 2); c.fill();
  }

  c.restore();
}

function drawAnimatedBrandText(T) {
  var chars = BRAND_TEXT.split("");
  var fontSize = 216;
  var fontSpec = "900 " + fontSize + "px 'Bebas Neue', 'Montserrat', Impact, sans-serif";
  c.font = fontSpec;
  c.textAlign = "center";
  c.textBaseline = "middle";

  var gap = 20;
  var widths = [];
  var totalW = 0;
  for (var i = 0; i < chars.length; i++) {
    var w = chars[i] === " " ? 64 : Math.max(96, c.measureText(chars[i]).width);
    widths.push(w);
    totalW += w;
  }
  totalW += (chars.length - 1) * gap;

  var startX = CX - totalW / 2;
  var baseY = CY - 24;

  // Per-character staggered animation timing (starts at 1.15s, each character takes 0.55s with 0.38s stagger)
  var curX = startX;
  var nonSpaceIdx = 0;

  for (var idx = 0; idx < chars.length; idx++) {
    var ch = chars[idx];
    var cw = widths[idx];
    var lx = curX + cw / 2;
    curX += cw + gap;

    if (ch === " ") continue;

    var t0 = 1.15 + nonSpaceIdx * 0.42;
    var charP = cl((T - t0) / 0.62, 0, 1);
    nonSpaceIdx++;

    if (charP <= 0.001) continue;

    var eOut = easeOutCubic(charP);
    var eBack = easeOutBack(charP);

    c.save();

    /* --- MODE-SPECIFIC PER-CHARACTER ANIMATION & RENDERING --- */
    if (MODE === "CYBER_GLITCH") {
      // RGB Split Glitch + Horizontal Slice Jitter + Laser Outline Trace
      var glitchAmp = (1 - eOut) * 45 + (T > 5.0 && Math.sin(T * 28 + idx) > 0.92 ? 8 : 0);
      var gx = lx + Math.sin(T * 60 + idx * 9) * glitchAmp;
      var gy = baseY + Math.cos(T * 45 + idx * 5) * (glitchAmp * 0.4);

      c.translate(gx, gy);
      if (glitchAmp > 2) {
        c.globalCompositeOperation = "screen";
        c.fillStyle = C1; c.fillText(ch, -glitchAmp * 0.45, 0);
        c.fillStyle = C2; c.fillText(ch, glitchAmp * 0.45, 0);
      }
      // Self-drawing neon stroke
      c.setLineDash([900 * eOut, 900]);
      c.strokeStyle = C1; c.lineWidth = 5;
      c.shadowColor = C1; c.shadowBlur = 28;
      c.strokeText(ch, 0, 0);
      if (charP > 0.35) {
        c.globalAlpha = (charP - 0.35) / 0.65;
        c.fillStyle = "#FFFFFF";
        c.fillText(ch, 0, 0);
      }

    } else if (MODE === "LIGHTNING_STRIKE") {
      // Jagged high-voltage lightning bolt strikes down from top of screen to forge the letter!
      if (charP < 0.45) {
        c.save();
        c.strokeStyle = "#FFFFFF"; c.lineWidth = 4 + (1 - charP) * 6;
        c.shadowColor = C1; c.shadowBlur = 35;
        c.beginPath();
        c.moveTo(lx + (sr(idx + T) - 0.5) * 120, 0);
        for (var segY = 80; segY <= baseY; segY += 75) {
          c.lineTo(lx + (sr(segY * idx + T * 30) - 0.5) * 90, segY);
        }
        c.lineTo(lx, baseY);
        c.stroke();
        c.restore();
      }
      c.translate(lx, baseY);
      c.scale(eBack, eBack);
      c.shadowColor = C1; c.shadowBlur = 32 * (1.5 - charP * 0.5);
      var lg = c.createLinearGradient(0, -fontSize * 0.5, 0, fontSize * 0.5);
      lg.addColorStop(0, "#FFFFFF"); lg.addColorStop(0.5, C1); lg.addColorStop(1, C2);
      c.fillStyle = lg;
      c.fillText(ch, 0, 0);

    } else if (MODE === "PARTICLE_ASSEMBLE") {
      // 45 glowing quantum particles swirl in from a vortex to condense into the letter!
      c.translate(lx, baseY);
      if (charP < 0.85) {
        var pFade = 1 - Math.max(0, (charP - 0.55) / 0.30);
        for (var q = 0; q < 36; q++) {
          var ang = q * 0.45 + (1 - eOut) * 6.5;
          var rad = (1 - eOut) * (240 + (q % 5) * 45);
          var qx = Math.cos(ang) * rad;
          var qy = Math.sin(ang) * rad;
          c.fillStyle = q % 2 === 0 ? C1 : C2;
          c.globalAlpha = pFade;
          c.beginPath(); c.arc(qx, qy, 4.5, 0, Math.PI * 2); c.fill();
        }
      }
      c.globalAlpha = cl((charP - 0.20) / 0.65, 0, 1);
      c.setLineDash([900 * eOut, 900]);
      c.strokeStyle = C1; c.lineWidth = 4;
      c.shadowColor = C1; c.shadowBlur = 24;
      c.strokeText(ch, 0, 0);
      c.fillStyle = "#FFFFFF";
      c.fillText(ch, 0, 0);

    } else if (MODE === "PISTON_SLAM_3D" || MODE === "GOLD_3D_SWEEP" || MODE === "SEARCHLIGHT_MONOLITH") {
      // 20-layer 3D Metallic Extrusion + Per-Letter Laser Rim Draw
      var dropY = MODE === "PISTON_SLAM_3D" ? -(1 - eBack) * 380 : (1 - eOut) * 75;
      c.translate(lx, baseY + dropY);
      c.scale(0.7 + 0.3 * eBack, 0.7 + 0.3 * eBack);

      var normX = (lx - CX) / (totalW * 0.5);
      for (var l = 18; l >= 1; l--) {
        var frac = l / 18;
        c.fillStyle = l % 2 === 0 ? C2 : "#2A1F0D";
        c.fillText(ch, -normX * 22 * frac, 16 * frac);
      }

      // Progressive vertical fill + laser stroke trace
      c.setLineDash([950 * eOut, 950]);
      c.strokeStyle = C3; c.lineWidth = 4.5;
      c.shadowColor = C1; c.shadowBlur = 26;
      c.strokeText(ch, 0, 0);

      if (charP > 0.25) {
        c.globalAlpha = (charP - 0.25) / 0.75;
        var fg = c.createLinearGradient(0, -fontSize * 0.5, 0, fontSize * 0.5);
        fg.addColorStop(0, C3); fg.addColorStop(0.5, C1); fg.addColorStop(1, C2);
        c.fillStyle = fg;
        c.fillText(ch, 0, 0);
      }

    } else if (MODE === "KATANA_SLASH") {
      // Diagonal Katana Blade Slash splits the letter into upper & lower halves that slide into lock!
      c.translate(lx, baseY);
      var slideOffset = (1 - eOut) * 140;

      // Upper diagonal half
      c.save();
      c.beginPath(); c.rect(-cw, -fontSize, cw * 2, fontSize); c.clip();
      c.fillStyle = "#FFFFFF";
      c.fillText(ch, -slideOffset, 0);
      c.restore();

      // Lower diagonal half
      c.save();
      c.beginPath(); c.rect(-cw, 0, cw * 2, fontSize); c.clip();
      c.fillStyle = C1;
      c.fillText(ch, slideOffset, 0);
      c.restore();

      // Glowing katana slash line across the letter
      if (charP < 0.75) {
        c.strokeStyle = "#FFFFFF"; c.lineWidth = (1 - charP / 0.75) * 8;
        c.shadowColor = C1; c.shadowBlur = 30;
        c.beginPath(); c.moveTo(-cw * 0.8, 25); c.lineTo(cw * 0.8, -25); c.stroke();
      }

    } else {
      // Universal Signature Self-Drawing Laser Contour + Rising Liquid Ribbon Fill + Sparkler Tip!
      // (Covers FIRE_FORGE, LIQUID_CHROME, SUPERNOVA_RIBBON, CRYSTAL_SHARDS, FOUNTAIN_PEN_DRAW,
      //  HUD_LASER_SCAN, AURORA_WAVE_WRITE, ECG_WAVE_DRAW, SILK_RIBBON_UNFOLD, FROST_CRYSTAL_GROW, etc.)
      c.translate(lx, baseY);
      var pop = charP < 0.85 ? (0.9 + 0.1 * (charP / 0.85)) : (1.0 + Math.sin(((charP - 0.85) / 0.15) * Math.PI) * 0.06);
      c.scale(pop, pop);

      // 1. Progressive Rising Liquid Ribbon Fill inside the letter
      var fillP = easeInOutCubic(cl((charP - 0.15) / 0.85, 0, 1));
      if (fillP > 0.01) {
        c.save();
        c.beginPath();
        var clipH = fontSize * 1.2 * fillP;
        c.rect(-cw, fontSize * 0.6 - clipH, cw * 2, clipH);
        c.clip();

        c.shadowColor = C1; c.shadowBlur = 24;
        var rGrad = c.createLinearGradient(0, -fontSize * 0.5, 0, fontSize * 0.5);
        rGrad.addColorStop(0.0, C3);
        rGrad.addColorStop(0.45, C1);
        rGrad.addColorStop(1.0, C2);
        c.fillStyle = rGrad;
        c.fillText(ch, 0, 0);
        c.restore();
      }

      // 2. Self-Drawing Laser Outline (`setLineDash`)
      c.save();
      c.setLineDash([950 * eOut, 950]);
      c.strokeStyle = charP < 0.85 ? "#FFFFFF" : C1;
      c.lineWidth = charP < 0.85 ? 5.5 : 2.5;
      c.shadowColor = C1;
      c.shadowBlur = 28;
      c.strokeText(ch, 0, 0);
      c.restore();

      // 3. Active Writing Pen Tip Flare & Sparks while character is drawing
      if (charP > 0.03 && charP < 0.94) {
        var penAng = charP * Math.PI * 2.2 - 1.57;
        var tx = Math.sin(penAng) * (cw * 0.34);
        var ty = -fontSize * 0.42 + charP * fontSize * 0.84;

        c.save();
        c.globalCompositeOperation = "screen";
        var pg = c.createRadialGradient(tx, ty, 0, tx, ty, 68);
        pg.addColorStop(0.0, "#FFFFFF");
        pg.addColorStop(0.3, C1);
        pg.addColorStop(1.0, "rgba(0,0,0,0)");
        c.fillStyle = pg;
        c.beginPath(); c.arc(tx, ty, 68, 0, Math.PI * 2); c.fill();

        for (var sp = 0; sp < 7; sp++) {
          var sa = sp * 0.9 + T * 15;
          var sd = 10 + ((T * 110 + sp * 11) % 36);
          c.fillStyle = sp % 2 === 0 ? "#FFFFFF" : C1;
          c.beginPath(); c.arc(tx + Math.cos(sa) * sd, ty + Math.sin(sa) * sd, 2.5, 0, Math.PI * 2); c.fill();
        }
        c.restore();
      }
    }

    c.restore();
  }

  // Glossy Floor Reflection & Animated Subtitle Tagline after letters lock in (T >= 3.85s)
  if (T >= 3.85) {
    var subP = easeOutCubic(seg(T, 3.85, 4.75));
    c.save();
    c.globalAlpha = subP * 0.92;
    c.font = "800 23px 'Montserrat', sans-serif";
    c.fillStyle = C3;
    c.shadowColor = C1;
    c.shadowBlur = 14;
    c.textAlign = "center";
    try { c.letterSpacing = "13px"; } catch(e) {}
    c.fillText(TAGLINE_TEXT, CX + 6, baseY + 158);
    c.restore();

    // Traveling Specular Light Sweep across the finished Brand Logo (4.20s -> 6.20s)
    if (T >= 4.20 && T <= 6.40) {
      var swP = seg(T, 4.20, 6.20);
      var swX = startX - 150 + swP * (totalW + 300);
      c.save();
      c.globalCompositeOperation = "screen";
      var swG = c.createLinearGradient(swX - 90, baseY - 120, swX + 90, baseY + 120);
      swG.addColorStop(0, "rgba(255,255,255,0)");
      swG.addColorStop(0.5, "rgba(255,255,255,0.48)");
      swG.addColorStop(1, "rgba(255,255,255,0)");
      c.fillStyle = swG;
      c.fillRect(startX - 40, baseY - 120, totalW + 80, 240);
      c.restore();
    }
  }
}

function frameAt(T) {
  drawBackdropAndEnvironment(T);
  drawAnimatedBrandText(T);
  var te = document.getElementById("timing");
  if (te) te.textContent = T.toFixed(2) + "s / " + TOTAL.toFixed(2) + "s [60 FPS]";
}

var isPlaying = false, playStart = 0, rafId = null;
var pvBtn = document.getElementById("pv"), replayBtn = document.getElementById("btnReplay");
var scSel = document.getElementById("scSel"), fsBtn = document.getElementById("btnFs"), dlBtn = document.getElementById("dl");
var stEl = document.getElementById("st");

PLAN.forEach(function(p, i) {
  var o = document.createElement("option");
  o.value = p.start;
  o.textContent = "Scene " + (i + 1) + ": " + (i === 0 ? "Per-Character Animated Draw" : "Master Lockup & Light Sweep");
  scSel.appendChild(o);
});

function playAt(offset) {
  getAudioContext();
  isPlaying = true;
  pvBtn.textContent = "⏸ Pause";
  stEl.textContent = "Status: Playing Heavy Industrial Titanium Piston 3D Drop Slam...";
  playStart = performance.now() - offset * 1000;
  if (document.getElementById("sf").checked && actx && offset <= 0.1) {
    scheduleTemplateAudio(actx, actx.currentTime - offset);
  }
  function loop() {
    if (!isPlaying) return;
    var t = (performance.now() - playStart) / 1000;
    if (t >= TOTAL) { frameAt(TOTAL); stopPlay(); stEl.textContent = "Status: Completed."; return; }
    frameAt(t);
    rafId = requestAnimationFrame(loop);
  }
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

function stopPlay() {
  isPlaying = false;
  pvBtn.textContent = "▶ Preview Chalao";
  if (rafId) cancelAnimationFrame(rafId);
}

pvBtn.onclick = function() { isPlaying ? stopPlay() : playAt(0); };
replayBtn.onclick = function() { stopPlay(); playAt(1.05); };
scSel.onchange = function() { stopPlay(); playAt(parseFloat(this.value) || 0); };
fsBtn.onclick = function() { !document.fullscreenElement ? cv.requestFullscreen() : document.exitFullscreen(); };
dlBtn.onclick = function() {
  stEl.textContent = "Status: Rendering 16-bit WAV...";
  renderSfxWav(function(b) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = "tpl18_titanium_mech_slam_sfx.wav";
    a.click();
    stEl.textContent = "Status: WAV Downloaded!";
  });
};

// Initial poster frame showing the per-character animation in action!
frameAt(2.85);
</script>
